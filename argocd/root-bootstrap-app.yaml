apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kianukroll/pub-k3s-cluster-bootstrap.git
    targetRevision: main
    path: argocd/infrastructure
    directory:
      recurse: true
      exclude: '{**/Chart.yaml,**/values.yaml,03-resources/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
