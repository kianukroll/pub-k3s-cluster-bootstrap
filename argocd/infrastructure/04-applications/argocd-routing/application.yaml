apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-routing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/kianukroll/pub-k3s-cluster-bootstrap.git
    targetRevision: main
    path: argocd/infrastructure/03-resources/argocd-routing
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true