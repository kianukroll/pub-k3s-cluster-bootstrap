apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-cluster-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: apps
  source:
    repoURL: "https://github.com/kianukroll/k3s-cluster.git"
    targetRevision: HEAD
    path: argocd
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
