apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: security
  source:
    repoURL: https://github.com/kianukroll/pub-k3s-cluster-bootstrap.git
    targetRevision: main
    path: argocd/infrastructure/03-resources/openbao-store
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true