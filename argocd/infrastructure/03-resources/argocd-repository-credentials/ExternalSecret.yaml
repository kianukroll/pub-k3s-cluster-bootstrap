apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo2-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: repo2-private-key-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/kianukroll/k3s-cluster.git
        username: x-access-token
        password: '{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: argocd/k3s-cluster
        property: password
