apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo2-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: repo2-private-key-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:YOUR-ORG/private-apps.git
        sshPrivateKey: '{{ .ssh_key }}'
  data:
    - secretKey: ssh_key
      remoteRef:
        key: argocd/private-repo
        property: ssh_key